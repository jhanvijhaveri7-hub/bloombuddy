spring.application.name=bloom-api
server.port=8080
spring.datasource.url=jdbc:h2:file:./backend/data/bloom;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:.env.backend[.properties],optional:file:../.env.backend[.properties]
